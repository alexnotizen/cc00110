<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI 10 - CHỮ HÁN</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f9fbff);
  display:flex; justify-content:center; color:#202124;
}
.app{width:min(760px,95vw); padding:24px 0 32px}
h1{text-align:center;margin:0 0 16px;font-size:28px}
.progress{text-align:center;font-size:16px;color:#666;margin-bottom:12px}

.card-wrap{perspective:1200px; cursor:pointer}
.card{
  width:100%; height:680px; position:relative; transform-style:preserve-3d;
  transition:transform .55s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; background:white; box-shadow:0 12px 35px rgba(30,60,100,.15);
  display:flex; flex-direction:column; justify-content:space-between; align-items:center;
  padding:28px 20px; border:1px solid #e6eaf0;
}

.stroke-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: auto 0;
  width: 100%;
}

.char-box {
  width: 260px;
  height: 260px;
  position: relative;
  border: 2px solid #feb2b2;
  border-radius: 12px;
  background-color: #fff;
  background-image: 
    linear-gradient(to right, transparent 49.5%, #fbb6ce 49.5%, #fbb6ce 50.5%, transparent 50.5%),
    linear-gradient(to bottom, transparent 49.5%, #fbb6ce 49.5%, #fbb6ce 50.5%, transparent 50.5%),
    linear-gradient(45deg, transparent 49.5%, #fed7e2 49.5%, #fed7e2 50.5%, transparent 50.5%),
    linear-gradient(-45deg, transparent 49.5%, #fed7e2 49.5%, #fed7e2 50.5%, transparent 50.5%);
  box-shadow: inset 0 0 8px rgba(229,62,62,0.05);
}

.char-box svg {
  position: absolute;
  top: 0;
  left: 0;
}

.back{transform:rotateY(180deg)}
.back .han-static{
  font-size: 72px;
  font-weight: bold;
  color: #e53e3e;
  margin-bottom: 8px;
  text-align: center;
  word-break: break-all;
  max-width: 100%;
}
.pinyin{font-size:40px;font-weight:700;color:#2b6cb0;margin-bottom:6px; text-align: center;}
.pos{font-size:24px;font-style:italic;color:#718096;margin-bottom:8px; text-align: center;}
.meaning{font-size:32px;color:#2d3748;font-weight:500; text-align: center;}
.note{font-size:18px;color:#4a5568;background:#f7fafc;padding:6px 12px;border-radius:8px;margin-top:6px;border:1px dashed #cbd5e0; text-align: center;}

.stroke-tools {
  display: flex;
  gap: 8px;
  margin-top: 6px;
}
.btn-small {
  padding: 10px 18px;
  font-size: 26px;
  border-radius: 12px;
  background: #edf2f7;
  color: #2d3748;
  border: 1px solid #cbd5e0;
  cursor: pointer;
}
.btn-small:hover { background: #e2e8f0; }

.hint{color:#999;font-size:26px;margin-top:8px}

.controls{display:flex;gap:12px;justify-content:center;margin-top:18px}
button{
  border:0;border-radius:14px;padding:12px 18px;font-size:16px;
  cursor:pointer;background:#e9eef7;color:#233044;
}
button.primary{background:#2563eb;color:white}
button:hover{filter:brightness(.97)}
.extra{display:flex;justify-content:center;gap:10px;margin-top:12px}
.speak{background:#fff4d6}
.shuffle{background:#e9f8ef}

@media(max-width:520px){
 .app{padding-top:16px}.card{height:600px}
 .char-box{width:140px; height:140px}
 .back .han-static{font-size:48px}
 .pinyin{font-size:32px}
 .pos{font-size:20px}
 .meaning{font-size:26px}
 .note{font-size:14px}
 .btn-small{font-size:20px; padding:8px 14px}
 .hint{font-size:20px}
 .controls button{padding:10px 14px}
}
</style>
</head>
<body>
<div class="app">
  <h1>🇨🇳 BÀI 10 - CHỮ HÁN</h1>
  <div class="progress" id="progress"></div>

  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front">
        <div class="stroke-container" id="strokeContainer"></div>
        
        <div class="stroke-tools">
          <button class="btn-small" onclick="event.stopPropagation(); animateStrokes();">▶ Xem nét viết</button>
        </div>
        <div class="hint">👆 Chạm để lật xem Phiên âm & Nghĩa</div>
      </div>

      <div class="face back">
        <div style="font-size:24px; color:#718096; font-weight:bold; margin-bottom:8px;">CHI TIẾT TỪ VỰNG</div>
        <div style="margin: auto 0; display:flex; flex-direction:column; align-items:center; width: 100%;">
          <div class="han-static" id="backHan"></div>
          <div class="pinyin" id="pinyin"></div>
          <div class="pos" id="pos"></div>
          <div class="meaning" id="meaning"></div>
          <div id="noteContainer"></div>
        </div>
        <div class="hint">👆 Chạm để lật lại mặt trước</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="event.stopPropagation();prevCard()">← Trước</button>
    <button class="primary" onclick="event.stopPropagation();flipCard()">Lật thẻ</button>
    <button onclick="event.stopPropagation();nextCard()">Tiếp →</button>
  </div>
  <div class="extra">
    <button class="speak" onclick="event.stopPropagation();speak()">🔊 Nghe phát âm</button>
    <button class="shuffle" onclick="event.stopPropagation();shuffleCards()">🔀 Trộn từ</button>
  </div>
</div>

<script>
const originalCards = [
  { "han": "水果", "pinyin": "shuǐguǒ", "pos": "danh từ", "meaning": "trái cây, quả" },
  { "han": "黃色", "pinyin": "huángsè", "pos": "danh từ", "meaning": "màu vàng" },
  { "han": "芒果", "pinyin": "mángguǒ", "pos": "danh từ", "meaning": "xoài" },
  { "han": "給", "pinyin": "gěi", "pos": "động từ", "meaning": "cho, tặng, đưa" },
  { "han": "塊", "pinyin": "kuài", "pos": "lượng từ", "meaning": "miếng", "note": "(dùng cho thức ăn như thịt, bánh)" },
  { "han": "香", "pinyin": "xiāng", "pos": "tính từ (trạng thái)", "meaning": "thơm" },
  { "han": "甜", "pinyin": "tián", "pos": "tính từ (trạng thái)", "meaning": "ngọt" },
  { "han": "紅色", "pinyin": "hóngsè", "pos": "danh từ", "meaning": "màu đỏ" },
  { "han": "西瓜", "pinyin": "xīguā", "pos": "danh từ", "meaning": "dưa hấu" },
  { "han": "吧", "pinyin": "ba", "pos": "trợ từ", "meaning": "nhỉ, phải không", "note": "(dùng cuối câu để đoán, đề nghị)" },
  { "han": "對", "pinyin": "duì", "pos": "tính từ (trạng thái)", "meaning": "đúng, phải" },
  { "han": "以前", "pinyin": "yǐqián", "pos": "danh từ", "meaning": "trước đây, trước kia" },
  { "han": "機會", "pinyin": "jīhuì", "pos": "danh từ", "meaning": "cơ hội" },
  { "han": "請", "pinyin": "qǐng", "pos": "động từ", "meaning": "mời (ai đó ăn/uống gì)" },
  { "han": "拍", "pinyin": "pāi", "pos": "động từ", "meaning": "chụp (ảnh)" },
  { "han": "笑", "pinyin": "xiào", "pos": "động từ", "meaning": "cười" },
  { "han": "開心", "pinyin": "kāixīn", "pos": "tính từ (trạng thái)", "meaning": "vui vẻ, vui mừng" },
  { "han": "穿", "pinyin": "chuān", "pos": "động từ", "meaning": "mặc, mang (quần áo)" },
  { "han": "衣服", "pinyin": "yīfú", "pos": "danh từ", "meaning": "quần áo" },
  { "han": "旅館", "pinyin": "lǚguǎn", "pos": "danh từ", "meaning": "khách sạn, nhà khách" },
  { "han": "太太", "pinyin": "tàitai", "pos": "danh từ", "meaning": "vợ, bà (cách gọi)" },
  { "han": "男", "pinyin": "nán", "pos": "danh từ", "meaning": "nam, đàn ông", "note": "(dùng trước danh từ)" },
  { "han": "矮", "pinyin": "ǎi", "pos": "tính từ (trạng thái)", "meaning": "thấp (chiều cao)" },
  { "han": "高", "pinyin": "gāo", "pos": "tính từ (trạng thái)", "meaning": "cao" },
  { "han": "弟弟", "pinyin": "dìdi", "pos": "danh từ", "meaning": "em trai" },
  { "han": "乾淨", "pinyin": "gānjìng", "pos": "tính từ (trạng thái)", "meaning": "sạch sẽ" },
  { "han": "窗戶", "pinyin": "chuānghù", "pos": "danh từ", "meaning": "cửa sổ" },
  { "han": "往", "pinyin": "wǎng", "pos": "giới từ", "meaning": "về phía, hướng tới" },
  { "han": "藍色", "pinyin": "lánsè", "pos": "danh từ", "meaning": "màu xanh dương, xanh lam" },
  { "han": "因為", "pinyin": "yīnwèi", "pos": "liên từ", "meaning": "bởi vì" },
  { "han": "住", "pinyin": "zhù", "pos": "động từ", "meaning": "ở, lưu trú" },
  { "han": "吃吃看", "pinyin": "chīchīkàn", "pos": "cụm từ", "meaning": "ăn thử, nếm thử xem" },
  { "han": "上個月", "pinyin": "shàng ge yuè", "pos": "cụm từ", "meaning": "tháng trước" },
  { "han": "這些", "pinyin": "zhèxiē", "pos": "cụm từ", "meaning": "những cái này, những thứ này" }
];

let cards = [...originalCards];
let index = 0;
let flipped = false;
let writers = [];

function render(){
  const c = cards[index];
  
  const container = document.getElementById('strokeContainer');
  container.innerHTML = '';
  writers = [];

  const cleanHan = c.han.replace(/[^一-龥]/g, '');
  const charArray = Array.from(cleanHan.length > 0 ? cleanHan : c.han);
  
  let boxSize = 220;
  if (charArray.length >= 5) boxSize = 100;
  else if (charArray.length >= 4) boxSize = 120;
  else if (charArray.length >= 3) boxSize = 160;
  
  if (window.innerWidth <= 520) {
    if (charArray.length >= 5) boxSize = 65;
    else if (charArray.length >= 4) boxSize = 75;
    else if (charArray.length >= 3) boxSize = 100;
    else boxSize = 130;
  }

  charArray.forEach((char, idx) => {
    const box = document.createElement('div');
    box.className = 'char-box';
    box.style.width = boxSize + 'px';
    box.style.height = boxSize + 'px';
    box.id = `char-box-${idx}`;
    container.appendChild(box);

    try {
      const writer = HanziWriter.create(box.id, char, {
        width: boxSize,
        height: boxSize,
        padding: 4,
        strokeColor: '#e53e3e',
        radicalColor: '#c53030',
        outlineColor: '#fed7d7',
        showOutline: true,
        delayBetweenStrokes: 150
      });
      writers.push(writer);
    } catch(e) {
      console.log(e);
    }
  });

  document.getElementById('backHan').textContent = c.han;
  document.getElementById('pinyin').textContent = c.pinyin;
  document.getElementById('pos').textContent = c.pos;
  document.getElementById('meaning').textContent = c.meaning;

  const noteContainer = document.getElementById('noteContainer');
  if (c.note) {
    noteContainer.innerHTML = `<div class="note">${c.note}</div>`;
  } else {
    noteContainer.innerHTML = '';
  }

  document.getElementById('progress').textContent = `Từ ${index+1} / ${cards.length}`;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function animateStrokes(){
  writers.forEach((writer, i) => {
    setTimeout(() => {
      writer.animateCharacter();
    }, i * 800);
  });
}

function flipCard(){
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function nextCard(){
  index = (index + 1) % cards.length;
  flipped = false; render();
}

function prevCard(){
  index = (index - 1 + cards.length) % cards.length;
  flipped = false; render();
}

function shuffleCards(){
  for(let i=cards.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]]=[cards[j],cards[i]];
  }
  index=0; flipped=false; render();
}

def_lang = 'zh-CN';
function speak(){
  const text=cards[index].han;
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=.75;
    speechSynthesis.speak(u);
  }else{
    alert('Trình duyệt của bạn không hỗ trợ phát âm.');
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') nextCard();
  else if(e.key==='ArrowLeft') prevCard();
  else if(e.key===' '){e.preventDefault();flipCard();}
});

render();
</script>
</body>
</html>
